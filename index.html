<title>拾光小本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --grid:#E9EEF4; --ink:#1A1A1A; --ink2:#5E6B7A; --stamp:#003366; --sheet:#FFFFFF; --shop:#003366;
  --tabc:#003366; --tabi:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#141414; --grid:#212A34; --ink:#F2F5F9; --ink2:#9AA7B6; --sheet:#1F1F1F; --stamp:#8FB4DE; --shop:#1B5A9C; }
}
:root[data-theme="dark"]{ --paper:#141414; --grid:#212A34; --ink:#F2F5F9; --ink2:#9AA7B6; --sheet:#1F1F1F; --stamp:#8FB4DE; --shop:#1B5A9C; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{
  margin:0; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:1rem; line-height:1.6;
}
html[lang="en"] body{ font-family:"Futura","Century Gothic","Helvetica Neue",Arial,sans-serif; }
button{ font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
button:disabled{ opacity:.4; cursor:default; }
input,textarea{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
.wk{ font-family:"LXGW WenKai TC","Kaiti TC","BiauKai","Huninn",serif; }
html[lang="en"] .wk{ font-family:Georgia,"Times New Roman",serif; }
html[data-motion="reduce"] *, html[data-motion="reduce"] *::before, html[data-motion="reduce"] *::after{
  animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; transition-delay:0s !important;
}

.wrap{ max-width:520px; margin:0 auto; padding:14px 18px 130px; }

/* header */
.top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.titlew{ filter:drop-shadow(0 2px 2px rgba(31,42,68,.28)); margin-top:6px; }
.title{
  display:inline-block; padding:6px 30px; font-size:2rem; line-height:1.35; color:#FFFFFF; margin:0; font-weight:400;
  transform:rotate(-1.6deg);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 7px,rgba(255,255,255,0) 7px 14px),#003366;
  clip-path:polygon(0 0,100% 0,98% 12%,100% 25%,98% 37%,100% 50%,98% 62%,100% 75%,98% 87%,100% 100%,0 100%,2% 87%,0 75%,2% 62%,0 50%,2% 37%,0 25%,2% 12%);
}
.icons{ display:flex; gap:2px; }
.clip{ width:44px; height:44px; display:grid; place-items:center; border-radius:50%; transition:background-color .2s, transform .15s; }
.clip:active{ transform:scale(.9); background:var(--grid); }
.clip svg{ width:26px; height:26px; }
.line{ color:var(--ink2); font-size:0.875rem; margin:12px 2px 0; }

/* index tabs */
.tabs{ display:flex; gap:6px; margin-top:16px; padding:4px 6px 0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs.fade{ -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent); }
.tab{
  flex:none; white-space:nowrap; padding:10px 16px 9px; border-radius:16px 16px 0 0; background:var(--tc); color:#FFFFFF; font-size:1.0625rem;
  transform:translateY(6px); opacity:.7; transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s ease; position:relative;
}
.tab.on{ transform:translateY(0); opacity:1; box-shadow:0 -2px 0 rgba(31,42,68,.14); }
.tab b{ font-weight:400; font-size:max(12px,0.8125rem); margin-left:6px; background:rgba(255,255,255,.85); color:#1A1A1A; border-radius:999px; padding:0 8px; }
.band{
  height:10px; border-radius:6px 12px 6px 6px;
  background-color:var(--tabc);
  background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 8px,rgba(255,255,255,0) 8px 16px);
  transition:background-color .35s ease;
}
.wrap.enter{ will-change:transform,opacity; }

.bar{ display:flex; justify-content:space-between; align-items:center; margin:18px 2px 6px; min-height:34px; }
.cnt{ color:var(--ink2); font-size:0.875rem; }
.dash{ border:2px dashed var(--ink2); border-radius:999px; padding:3px 16px; font-size:0.9375rem; transition:transform .15s, border-color .15s; }
.dash:active{ transform:scale(.95); border-color:var(--ink); }
.search{
  width:100%; background:transparent; border:0; border-bottom:2px dashed var(--ink2);
  padding:8px 4px; outline:none; margin:4px 0 12px; font-size:1rem; transition:border-color .2s;
}
.search:focus{ border-bottom-color:var(--ink); }

/* sticker chips */
.chips{ display:flex; flex-wrap:wrap; gap:6px 8px; }
.chip{
  background:var(--c,#fff); color:var(--ci,#1A1A1A); border:1.5px solid rgba(0,51,102,.22); border-radius:999px; padding:1px 14px; font-size:0.875rem; margin:3px 2px;
  box-shadow:0 0 0 2px #fff, 0 2px 5px rgba(0,51,102,.22); transition:box-shadow .18s ease, transform .15s ease;
}
.chip:active{ transform:scale(.94); }
.chip.on{ box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--ink); }
.chip .x{ margin-left:6px; font-size:0.9375rem; }

/* sticky-note wall */
.wall{ columns:2; column-gap:18px; padding:26px 4px 0; }
.note{
  display:inline-block; width:100%; margin:0 0 22px; padding:24px 15px 12px; position:relative; text-align:left;
  background:var(--c); color:var(--nink,#1A1A1A); border:1px solid rgba(0,51,102,.14); transform:rotate(var(--r,0deg)); border-radius:2px 2px 2px 14px / 2px 2px 2px 10px;
  box-shadow:0 1px 1px rgba(31,42,68,.18), 0 8px 14px -8px rgba(31,42,68,.45);
  break-inside:avoid; transition:transform .2s ease;
}
button.note:active{ transform:rotate(var(--r,0deg)) scale(.975); }
.note .qt{ margin:0; font-size:1.0625rem; line-height:1.75; white-space:pre-wrap; word-break:break-word; }
.note .meta{ display:flex; flex-wrap:wrap; gap:4px 8px; margin-top:10px; font-size:max(12px,0.7812rem); opacity:.8; font-family:"Huninn",sans-serif; }
html[lang="en"] .note .meta{ font-family:"Futura","Helvetica Neue",Arial,sans-serif; }
.note .meta em{ font-style:normal; border:1px solid currentColor; border-radius:999px; padding:0 8px; }
.tape{
  position:absolute; top:-11px; left:var(--tx,50%); width:64px; height:22px; margin-left:-32px; transform:rotate(var(--tr,0deg));
  clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%);
}
.t0{ background:repeating-linear-gradient(45deg,rgba(0,51,102,.5) 0 5px,rgba(255,255,255,.88) 5px 10px); }
.t1{ background:rgba(220,230,240,.95); }
.t2{ background:radial-gradient(rgba(0,51,102,.7) 20%,transparent 23%) 0 0/9px 9px, rgba(255,255,255,.92); }
.pin{
  position:absolute; top:-8px; left:50%; width:17px; height:17px; margin-left:-8px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#7aa5d2,#003366 60%,#001a33); box-shadow:0 3px 4px rgba(0,0,0,.3);
}

/* cafe stamp cards */
.clist{ padding-top:16px; }
.ccard{
  position:relative; background:#FFFFFF; color:#1A1A1A; border:1px solid rgba(0,51,102,.2); padding:16px 16px 12px 26px; margin:0 0 18px; cursor:pointer;
  border-radius:6px 14px 14px 6px; box-shadow:0 1px 1px rgba(31,42,68,.18), 0 8px 14px -8px rgba(31,42,68,.5);
  content-visibility:auto; contain-intrinsic-size:auto 190px; transition:transform .15s ease;
}
.ccard:active{ transform:scale(.99); }
.ccard::before{ content:''; position:absolute; left:11px; top:10px; bottom:10px; border-left:3px dotted rgba(0,51,102,.45); }
.ccard h4{ margin:0; font-size:1.375rem; font-weight:400; line-height:1.35; padding-right:70px; }
.ccard .addr{ margin:6px 0 0; font-size:0.875rem; opacity:.85; }
.ccard .info{ margin:8px 0 0; font-size:0.9375rem; line-height:1.7; white-space:pre-wrap; }
.ccard .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.ccard .tags span{ background:var(--c,#fff); color:var(--ci,#1A1A1A); border:1px solid rgba(0,51,102,.2); border-radius:999px; padding:0 11px; font-size:max(12px,0.8125rem); }
.ccard .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.lk{ text-decoration:none; border:2px solid #003366; color:#003366; border-radius:999px; padding:1px 14px; font-size:0.875rem; transition:transform .15s; display:inline-block; }
.lk:active{ transform:scale(.94); }
.lk.solid{ background:#003366; color:#FFFFFF; font-family:inherit; cursor:pointer; }
.cups{ font-size:0.875rem; margin-top:8px; letter-spacing:2px; }
.dots{ display:flex; align-items:center; gap:6px; margin-top:12px; }
.dot{ width:16px; height:16px; border-radius:50%; border:2px dashed rgba(0,51,102,.45); flex:none; }
.dot.on{ background:#003366; border:2px solid #003366; }
.dot.new{ animation:stampIn .55s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes stampIn{ from{ transform:scale(2.4) rotate(-30deg); opacity:0; } to{ transform:none; opacity:1; } }
.vx{ font-size:max(12px,0.8125rem); margin-left:2px; color:#003366; }
.lastv{ font-size:max(12px,0.7812rem); opacity:.7; margin-left:auto; }
.stamp{
  position:absolute; right:14px; top:14px; padding:1px 12px; border-radius:10px; font-size:0.9375rem; color:#003366;
  border:2.5px solid #003366; transform:rotate(8deg); letter-spacing:1px;
}
.stamp.want{ border-style:dashed; }
.stamp.been{ background:#003366; color:#FFFFFF; }
.stamp.ticket{ background:rgba(0,51,102,.08); }
.stamp.past{ border-style:dotted; color:#5E6B7A; border-color:#5E6B7A; }

/* event tickets */
.elist{ padding-top:16px; }
.ewrap{ margin:0 0 18px; border-radius:6px; box-shadow:0 1px 1px rgba(31,42,68,.2), 0 8px 12px -6px rgba(0,51,102,.28); content-visibility:auto; contain-intrinsic-size:auto 170px; }
.ecard{
  --nx:74px; position:relative; display:flex; background:#FFFFFF; color:#1A1A1A; cursor:pointer; border-radius:6px; overflow:hidden; transition:transform .15s ease;
  -webkit-mask:radial-gradient(circle 9px at var(--nx) 0,#0000 97%,#000) top/100% 51% no-repeat, radial-gradient(circle 9px at var(--nx) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 9px at var(--nx) 0,#0000 97%,#000) top/100% 51% no-repeat, radial-gradient(circle 9px at var(--nx) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;
}
.ecard:active{ transform:scale(.99); }
.edate{ flex:0 0 74px; background:#003366; color:#FFFFFF; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px 4px; text-align:center; line-height:1.2; }
.edate .mo{ font-size:0.875rem; opacity:.9; }
.edate .dd{ font-size:2.125rem; font-weight:400; line-height:1.1; }
.edate .wd{ font-size:max(12px,0.8125rem); opacity:.85; }
.ebody{ flex:1; min-width:0; padding:14px 14px 12px 16px; border-left:2px dashed rgba(0,51,102,.35); }
.ecard h4{ margin:0; font-size:1.25rem; font-weight:400; line-height:1.4; padding-right:62px; }
.cdl{ display:inline-block; margin:6px 0 0; padding:0 11px; border:1.5px solid #003366; color:#003366; border-radius:999px; font-size:max(12px,0.8438rem); }
.cdl.soon{ background:#003366; color:#FFFFFF; }
.emeta,.eplace,.eprice{ margin:6px 0 0; font-size:0.875rem; opacity:.85; }
.ecard .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.ecard .tags span{ background:var(--c,#fff); color:var(--ci,#1A1A1A); border:1px solid rgba(0,51,102,.2); border-radius:999px; padding:0 11px; font-size:max(12px,0.8125rem); }
.ecard .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.ecard.past .edate{ background:#5B6673; }
.ecard.past h4,.ecard.past .eplace{ opacity:.7; }
.ecard.past .cdl{ border-color:#5E6B7A; color:#5E6B7A; }

/* recommendations: chat bubbles */
.rlist{ padding-top:16px; display:flex; flex-direction:column; gap:18px; }
.rcard{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; content-visibility:auto; contain-intrinsic-size:auto 150px; }
.av{ flex:none; width:40px; height:40px; margin-top:22px; border-radius:50%; background:var(--c); color:var(--ci,#1A1A1A); display:grid; place-items:center; font-size:1.125rem; box-shadow:0 0 0 2px #fff, 0 2px 5px rgba(0,51,102,.25); }
.rcol{ flex:1; min-width:0; }
.rfrom{ margin:0 0 4px 4px; font-size:max(12px,0.8125rem); color:var(--ink2); }
.bubble{ position:relative; background:#FFFFFF; color:#1A1A1A; border:1px solid rgba(0,51,102,.2); border-radius:4px 18px 18px 18px; padding:12px 14px; box-shadow:0 1px 1px rgba(31,42,68,.16), 0 8px 12px -8px rgba(31,42,68,.45); transition:transform .15s ease; }
.bubble::before{ content:''; position:absolute; left:-7px; top:11px; width:12px; height:12px; background:#FFFFFF; border-left:1px solid rgba(0,51,102,.2); border-bottom:1px solid rgba(0,51,102,.2); transform:rotate(45deg); }
.rcard:active .bubble{ transform:scale(.99); }
.bubble h4{ margin:0; font-size:1.25rem; font-weight:400; line-height:1.4; padding-right:64px; }
.bubble .said{ margin:6px 0 0; font-size:1rem; line-height:1.7; white-space:pre-wrap; }
.bubble .stamp{ right:10px; top:10px; }
.bubble .tags, .wcard .tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.bubble .tags span, .wcard .tags span{ background:var(--c,#fff); color:var(--ci,#1A1A1A); border:1px solid rgba(0,51,102,.2); border-radius:999px; padding:0 11px; font-size:max(12px,0.8125rem); }
.bubble .links, .wcard .links{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

/* wishlist: hang tags */
.wlist{ padding-top:14px; }
.wstats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 4px; }
.wstats div{ border:1.5px solid rgba(0,51,102,.25); border-radius:14px; padding:8px 6px; text-align:center; background:var(--sheet); min-width:0; }
.wstats b{ display:block; font-size:1.0625rem; font-weight:400; color:var(--stamp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wstats span{ font-size:max(12px,0.75rem); color:var(--ink2); }
.wcard{ position:relative; background:#FFFFFF; color:#1A1A1A; border:1px solid rgba(0,51,102,.2); border-radius:24px 8px 8px 8px; padding:16px 16px 12px 34px; margin:0 0 18px; cursor:pointer; box-shadow:0 1px 1px rgba(31,42,68,.18), 0 8px 14px -8px rgba(31,42,68,.5); content-visibility:auto; contain-intrinsic-size:auto 160px; transition:transform .15s ease; }
.wcard:active{ transform:scale(.99); }
.wcard::before{ content:''; position:absolute; left:12px; top:14px; width:12px; height:12px; border-radius:50%; background:var(--paper); border:1.5px solid rgba(0,51,102,.5); box-shadow:inset 0 1px 2px rgba(0,0,0,.25); }
.wrow{ display:flex; gap:12px; align-items:center; }
.ring{ flex:none; width:46px; height:46px; }
.wr{ min-width:0; flex:1; }
.wcard h4{ margin:0; font-size:1.25rem; font-weight:400; line-height:1.4; padding-right:64px; }
.price{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-top:2px; }
.price b{ font-size:1.375rem; font-weight:400; color:#003366; }
.price.dropped b{ text-decoration:line-through; color:#5E6B7A; }
.price .tgt{ font-size:max(12px,0.8125rem); opacity:.75; }
.wcard .pills{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
.wcard .pills .cdl{ margin:0; }
.wnote{ margin:8px 0 0; font-size:0.875rem; opacity:.85; white-space:pre-wrap; }
.big .rcard,.big .wcard{ content-visibility:visible; }

/* quieter filters: status = segmented, tags = one scrolling row of neutral pills */
.segm{ display:flex; gap:2px; padding:3px; border:1.5px solid rgba(94,107,122,.45); border-radius:999px; overflow-x:auto; scrollbar-width:none; margin:2px 0 4px; }
.segm::-webkit-scrollbar, .ftags::-webkit-scrollbar{ display:none; }
.segm button{ flex:1 0 auto; padding:3px 14px; border-radius:999px; font-size:0.875rem; color:var(--ink2); white-space:nowrap; transition:background-color .2s ease, color .2s ease; }
.segm button.on{ background:var(--ink); color:var(--paper); }
.ftags{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:6px 2px 8px; }
.segm.fade, .ftags.fade{ -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent); }
.tg{ flex:none; display:inline-flex; align-items:center; gap:6px; border:1.5px solid rgba(94,107,122,.4); border-radius:999px; padding:1px 12px 1px 8px; font-size:0.875rem; color:var(--ink); transition:background-color .2s ease, color .2s ease, border-color .2s ease, transform .15s ease; }
.tg:active{ transform:scale(.95); }
.tg i{ width:10px; height:10px; border-radius:50%; background:var(--c); border:1px solid rgba(0,51,102,.35); }
.tg small{ font-size:max(12px,0.75rem); color:var(--ink2); }
.tg.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.tg.on small{ color:inherit; opacity:.75; }
.tg.on::after{ content:'×'; margin-left:2px; }
.tg.manage{ border-style:dashed; padding:1px 12px; color:var(--ink2); }

/* tag picker (forms) + tag manager */
.picker .chips{ margin-bottom:4px; }
.picker .field{ margin-top:6px; }
.chip.addnew{ background:transparent; border-style:dashed; color:var(--ink); box-shadow:none; }
.chip.more{ background:transparent; color:var(--ink2); border-style:dashed; box-shadow:none; }
.trow{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1.5px solid var(--grid); }
.tdot{ flex:none; width:28px; height:28px; border-radius:50%; background:var(--c); border:2px solid rgba(0,51,102,.3); }
.tname{ flex:1; min-width:0; background:transparent; border:0; border-bottom:1.5px dashed transparent; padding:4px 2px; outline:none; font-size:1rem; transition:border-color .2s; }
.tname:focus{ border-bottom-color:var(--ink2); }
.tcnt{ color:var(--ink2); font-size:max(12px,0.8125rem); min-width:22px; text-align:right; }
.tdel{ flex:none; font-size:max(12px,0.8125rem); padding:2px 12px; border:1.5px solid var(--ink2); border-radius:999px; transition:background-color .2s, color .2s; }
.tdel.arm{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.swatches{ display:flex; gap:10px; flex-wrap:wrap; padding:2px 0 10px 38px; }
.sq{ width:30px; height:30px; border-radius:50%; background:var(--c); border:2px solid rgba(0,51,102,.25); transition:transform .15s; }
.sq:active{ transform:scale(.9); }
.sq.on{ box-shadow:0 0 0 2px var(--sheet), 0 0 0 4px var(--ink); }
.setlink{ display:flex; justify-content:space-between; align-items:center; width:100%; padding:12px 0; border-top:1.5px solid var(--grid); text-align:left; font-size:1rem; }
.setlink .cn{ color:var(--ink2); font-size:0.875rem; }

/* add-to-home-screen card + guide */
.notice.a2{ flex-wrap:nowrap; gap:12px; padding:10px 8px 10px 12px; border-style:solid; border-color:rgba(0,51,102,.28); }
.notice.a2 .ni{ width:46px; height:46px; border-radius:11px; flex:none; box-shadow:0 2px 6px rgba(0,51,102,.3); }
.notice.a2 .nt{ flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.35; }
.notice.a2 .nt b{ font-weight:400; font-size:1rem; }
.notice.a2 .nt span{ flex:none; min-width:0; font-size:max(12px,.8125rem); color:var(--ink2); }
.notice.a2 .nx{ flex:none; width:30px; height:30px; color:var(--ink2); font-size:1.25rem; line-height:1; border-radius:50%; }
.a2big{ display:flex; gap:14px; align-items:center; margin:4px 0 6px; }
.a2big img{ width:64px; height:64px; border-radius:15px; flex:none; box-shadow:0 3px 10px rgba(0,51,102,.35); }
.a2big p{ margin:0; font-size:.9375rem; color:var(--ink2); }
.steps{ list-style:none; padding:0; margin:10px 0 0; counter-reset:st; }
.steps li{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1.5px solid var(--grid); counter-increment:st; }
.steps li::before{ content:counter(st); flex:none; width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-size:max(12px,.8125rem); margin-top:1px; }
.steps .glyph{ width:20px; height:20px; vertical-align:-4px; margin:0 2px; }
.stitle{ margin:16px 0 0; font-size:.875rem; color:var(--ink2); }

.notice.warn{ border-style:solid; border-color:var(--stamp); }
.bt{ display:flex; align-items:center; gap:6px; }
.clip.sm{ width:34px; height:34px; }
.clip.sm svg{ width:20px; height:20px; }
.tiles{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.tile{ display:flex; align-items:center; gap:12px; text-align:left; padding:10px 12px; border:1.5px solid rgba(94,107,122,.45); border-radius:16px; transition:border-color .2s ease, background-color .2s ease, transform .15s ease; }
.tile:active{ transform:scale(.99); }
.tile i{ flex:none; width:24px; height:24px; border-radius:50%; border:2px solid var(--ink2); display:grid; place-items:center; transition:background-color .2s ease, border-color .2s ease; }
.tile.on{ border-color:var(--ink); background:rgba(0,51,102,.07); }
.tile.on i{ background:var(--ink); border-color:var(--ink); }
.tile.on i::after{ content:'✓'; color:var(--paper); font-size:max(12px,.8125rem); line-height:1; }
.tile b{ display:block; font-weight:400; font-size:1.0625rem; }
.tile small{ display:block; color:var(--ink2); font-size:max(12px,.8125rem); line-height:1.4; }

/* Today is a dashboard, not a collection: paper tab with an outline, sun icon and a divider */
.tab.today{ background:var(--paper); color:var(--ink); border:2px solid var(--ink); border-bottom:0; display:inline-flex; align-items:center; gap:6px; }
.tab.today svg{ width:16px; height:16px; flex:none; }
.tabsep{ flex:none; align-self:center; width:0; height:22px; border-left:2px dotted var(--ink2); margin:0 2px 0 4px; opacity:.6; }

.clip{ position:relative; }
.clip.sm.on{ background:var(--ink); color:var(--paper); }
.clip.sm.mark::after{ content:''; position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--stamp); }
.srow{ display:flex; align-items:center; gap:4px; margin:4px 0 12px; }
.srow .search{ flex:1; min-width:0; margin:0; }
.fab{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
/* select mode */
.selbar{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); width:min(520px,calc(100% - 24px)); z-index:35; background:var(--ink); color:var(--paper); border-radius:22px; padding:8px 10px; display:flex; align-items:center; gap:6px; box-shadow:0 8px 24px rgba(0,0,0,.35); animation:up2 .25s cubic-bezier(.2,.8,.2,1); }
@keyframes up2{ from{ transform:translate(-50%,24px); opacity:0 } to{ transform:translate(-50%,0); opacity:1 } }
.selbar[hidden]{ display:none; }
.selbar .n{ flex:1; font-size:.9375rem; padding-left:6px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.selbar button{ flex:none; padding:5px 11px; border-radius:999px; font-size:.875rem; color:var(--paper); border:1.5px solid rgba(128,128,128,.55); transition:background-color .2s, color .2s; }
.selbar button.arm{ background:var(--paper); color:var(--ink); }
.selbar button:disabled{ opacity:.35; }
html.selecting #fab{ display:none; }
html.selecting .wrap{ padding-bottom:150px; }
[data-sel]{ position:relative; }
[data-sel]::after{ content:''; position:absolute; top:6px; left:6px; width:24px; height:24px; border-radius:50%; background:var(--paper); border:2px solid var(--ink); z-index:3; pointer-events:none; }
[data-sel="1"]::after{ content:'✓'; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-size:.875rem; line-height:1; }
[data-sel="1"]{ outline:3px solid var(--ink); outline-offset:2px; }
.ecard[data-sel]{ outline:none; }
.ewrap[data-selw="1"]{ outline:3px solid var(--ink); outline-offset:2px; }
.wcard[data-sel]::before{ display:none; }
/* crash / recovery screen */
.crash{ position:fixed; inset:0; z-index:200; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:24px; }
.crash[hidden]{ display:none; }
.crash .box{ max-width:420px; text-align:center; }
.crash h2{ margin:0 0 10px; font-size:1.5rem; font-weight:400; }
.crash p{ margin:0 0 16px; color:var(--ink2); }

/* books */
.kcard{ position:relative; background:#FFFFFF; color:#1A1A1A; border:1px solid rgba(0,51,102,.2); border-radius:14px; padding:16px 16px 12px; margin:0 0 18px; box-shadow:0 1px 1px rgba(31,42,68,.18), 0 8px 14px -8px rgba(31,42,68,.5); cursor:pointer; content-visibility:auto; contain-intrinsic-size:auto 170px; transition:transform .15s ease; }
.kcard:active{ transform:scale(.99); }
.kcard h4{ margin:0; font-size:1.25rem; font-weight:400; line-height:1.35; padding-right:64px; }
.kcard .author{ margin:4px 0 0; font-size:.875rem; color:var(--ink2); }
.kbar{ height:8px; border-radius:999px; background:var(--grid); overflow:hidden; margin-top:10px; }
.kbar i{ display:block; height:100%; background:#1F7A7A; }
.kprog{ margin:6px 0 0; font-size:max(12px,.8125rem); color:var(--ink2); }
.klist{ padding-top:16px; }

/* guide */
.gd p{ margin:5px 0; font-size:.9375rem; line-height:1.75; }
.guidelink{ display:flex; justify-content:space-between; align-items:center; width:100%; padding:12px 14px; margin:0 0 10px; border:1.5px dashed var(--ink2); border-radius:16px; text-align:left; font-size:1rem; transition:border-color .2s; }
.guidelink:active{ border-color:var(--ink); }
.guidelink span{ color:var(--ink2); font-size:max(12px,.8125rem); }

/* first-run tips booklet */
.tip{ text-align:center; padding:8px 6px 4px; animation:tipIn .3s ease; }
@keyframes tipIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.tip .ti{ width:84px; height:84px; margin:4px auto 20px; border-radius:50%; display:grid; place-items:center; background:var(--c); color:#FFFFFF; position:relative; }
.tip .ti svg{ width:38px; height:38px; }
.tip h4{ margin:0 0 10px; font-size:1.375rem; font-weight:400; }
.tip p{ margin:0; font-size:.9375rem; line-height:1.8; color:var(--ink2); }
.holdring::before,.holdring::after{ content:''; position:absolute; inset:-9px; border:2px solid #FFFFFF; border-radius:50%; opacity:0; animation:holdpulse 1.8s ease-out infinite; }
.holdring::after{ animation-delay:.7s; }
@keyframes holdpulse{ 0%{ opacity:.7; transform:scale(.72); } 100%{ opacity:0; transform:scale(1.4); } }
.tipdots{ display:flex; justify-content:center; gap:7px; margin:24px 0 4px; }
.tipdots i{ width:16px; height:16px; margin:-4.5px; display:grid; place-items:center; cursor:pointer; }
.tipdots i::after{ content:''; width:7px; height:7px; border-radius:50%; background:var(--grid); transition:background-color .2s ease, transform .2s ease; }
.tipdots i.on::after{ background:var(--ink); transform:scale(1.3); }
.tipnav{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
html[data-motion="reduce"] .holdring::before, html[data-motion="reduce"] .holdring::after{ display:none; }

/* two-tier tab navigation: Today + 3 group pills, with a sliding sub-tab row underneath */
.subwrap[hidden]{ display:none; }
.subtabs{ display:flex; gap:8px; padding:12px 4px 4px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.subtabs::-webkit-scrollbar{ display:none; }
.subtabs.fade{ -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent); }
.subtab{ flex:none; display:inline-flex; align-items:center; gap:7px; padding:6px 14px 6px 10px; border-radius:999px; border:1.5px solid rgba(94,107,122,.4); font-size:.9375rem; color:var(--ink); background:var(--sheet); transition:background-color .2s ease, color .2s ease, border-color .2s ease, transform .15s ease; }
.subtab:active{ transform:scale(.96); }
.subtab i{ width:9px; height:9px; border-radius:50%; background:var(--c); flex:none; }
.subtab b{ font-weight:400; font-size:max(12px,.8125rem); opacity:.6; margin-left:1px; }
.subtab.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

/* sheets */

  position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:min(560px,100%); max-height:92%; overflow-y:auto; overscroll-behavior:contain;
  background:var(--sheet); color:var(--ink); border-radius:26px 26px 0 0; padding:20px 20px calc(26px + env(safe-area-inset-bottom,0px));
  animation:up .32s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes fade{ from{ opacity:0 } to{ opacity:1 } }

@keyframes up{ from{ transform:translate(-50%,44px); opacity:0 } to{ transform:translate(-50%,0); opacity:1 } }

.grabtape{ display:block; width:96px; height:20px; margin:-6px auto 10px; background:repeating-linear-gradient(45deg,rgba(0,51,102,.85) 0 6px,rgba(0,51,102,.5) 6px 12px); clip-path:polygon(0 0,100% 0,97% 25%,100% 50%,97% 75%,100% 100%,0 100%,3% 75%,0 50%,3% 25%); }

/* ---------- intro: walk into the shop ---------- */
.intro{
  position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; cursor:pointer; overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px); background-size:26px 26px;

}

.scene{
  --w:min(86vw,360px,50vh); position:relative; width:var(--w); height:calc(var(--w)*1.1); transform-origin:73.8% 66%;

}

.sign::before{ left:-6%; transform:rotate(-24deg); }
.sign::after{ right:-6%; transform:rotate(24deg); }

.shop{ position:absolute; left:6%; right:6%; top:19%; bottom:4%; background:var(--shop); border-radius:4px 4px 0 0; }

.wn::after{ content:''; position:absolute; left:14%; right:14%; top:34%; height:2px; background:rgba(0,0,0,.25); box-shadow:0 6px 0 rgba(0,0,0,.25), 0 12px 0 rgba(0,0,0,.25); }
.n1{ left:8%; top:10%; background:#FFFFFF; transform:rotate(-7deg); }
.n2{ left:38%; top:6%; background:#7FA0C2; transform:rotate(5deg); }
.n3{ left:68%; top:12%; background:#003366; transform:rotate(-4deg); }
.shelf{ position:absolute; left:0; right:0; top:64%; height:3px; background:#1A1A1A; }
.cup{ position:absolute; left:50%; top:44%; width:20%; height:20%; margin-left:-10%; background:#FFFFFF; border-radius:2px 2px 40% 40%; box-shadow:0 0 0 1px rgba(0,51,102,.2); }

.doorwrap{ position:absolute; left:62%; top:24%; width:30%; bottom:0; perspective:700px; }

  /* ---------- filtering ---------- */
  function getItems(kind,opt){
    var raw=opt&&opt.raw, f=raw?{s:'all',t:''}:F[kind], sv=(opt&&opt.q!==undefined)?opt.q:search, s=sv.trim().toLowerCase(), st=f.s, tk=f.t, L=itemsOf(kind).slice();
    if(tk){
      if(tk.indexOf('from:')===0){ var fr=tk.slice(5); L=L.filter(function(x){return (x.from||x.person||x.org||'').trim()===fr}); }
      else { var nm=tk.slice(tk.indexOf(':')+1); L=L.filter(function(x){var cs=x.cats||[]; return nm?cs.indexOf(nm)>=0:cs.length===0}); }
    }
    if(kind==='q'){
      if(s) L=L.filter(function(q){return (q.text+' '+q.source+' '+q.note+' '+(q.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('q',L,function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.created-a.created});
    }
    if(kind==='c'){
      if(st==='want'||st==='been') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+x.address+' '+x.info+' '+x.note+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('c',L,function(a,b){return b.created-a.created});
    }
    if(kind==='e'){
      if(st==='soon') L=L.filter(function(x){return !evState(x).past});
      else if(st==='past') L=L.filter(function(x){return evState(x).past});
      else if(st==='want'||st==='ticket'||st==='been') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+x.place+' '+x.info+' '+x.note+' '+x.price+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('e',L,evCmp);
    }
    if(kind==='r'){
      if(st==='todo'||st==='done'||st==='pass') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+(x.from||'')+' '+(x.why||'')+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      var ord={todo:0,done:1,pass:2};
      return sortWith('r',L,function(a,b){return (ord[a.status]-ord[b.status])||b.created-a.created});
    }
    if(kind==='w'){
      if(st==='ready'||st==='cooling') L=L.filter(function(x){return wishState(x).k===st});
      else if(st==='want'||st==='bought'||st==='drop') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('w',L,wishCmp);
    }
    if(kind==='b'){
      if(st==='want'||st==='reading'||st==='done') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+(x.author||'')+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      var ordB={reading:0,want:1,done:2};
      return sortWith('b',L,function(a,b){return (ordB[a.status]-ordB[b.status])||b.created-a.created});
    }
    if(kind==='p'){
      if(st==='want'||st==='been') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+x.address+' '+x.info+' '+x.note+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('p',L,function(a,b){return b.created-a.created});
    }
    if(kind==='l'){
      if(st==='unread'||st==='read') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+x.url+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('l',L,function(a,b){return ((a.status==='read')-(b.status==='read'))||b.created-a.created});
    }
    if(kind==='a'){
      if(st==='soon') L=L.filter(function(x){var dd=dateDays(x); return dd!==null&&dd>=0&&dd<=30});
      if(s) L=L.filter(function(x){return (x.name+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('a',L,dateCmp);
    }
    if(kind==='t'){
      if(st==='want'||st==='plan'||st==='done') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+x.dest+' '+x.plan+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('t',L,tripCmp);
    }
    if(kind==='o'){
      if(st==='want'||st==='prep'||st==='applied'||st==='closed') L=L.filter(function(x){return x.status===st});
      else if(st==='urgent') L=L.filter(function(x){var dd=oppDays(x); return (x.status==='want'||x.status==='prep')&&dd!==null&&dd>=0&&dd<=14});
      if(s) L=L.filter(function(x){return (x.name+' '+x.org+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      return sortWith('o',L,oppCmp);
    }
    if(kind==='g'){
      if(st==='idea'||st==='bought'||st==='given') L=L.filter(function(x){return x.status===st});
      if(s) L=L.filter(function(x){return (x.name+' '+x.person+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
      var ordG={idea:0,bought:1,given:2};
      return sortWith('g',L,function(a,b){return (ordG[a.status]-ordG[b.status])||b.created-a.created});
    }
    if(s) L=L.filter(function(x){return (x.text+' '+(x.note||'')+' '+(x.cats||[]).map(dn).join(' ')).toLowerCase().indexOf(s)>=0});
    return sortWith('i',L,function(a,b){return (b.pin?1:0)-(a.pin?1:0)||b.created-a.created});
  }

  /* ---------- sorting ---------- */
  function sortKey(kind){ return (S.set.sort&&S.set.sort[kind])||'def'; }
  function cmpText(a,b){ return String(a||'').localeCompare(String(b||''),lang==='en'?'en':'zh-Hant'); }
  function sortOptions(kind){
    var o=[['def',t(({q:'sortDefQ',c:'sortDefC',e:'sortDefE',r:'sortDefR',w:'sortDefW',b:'sortDefB',p:'sortDefP',i:'sortDefI',l:'sortDefL',a:'sortDefA',t:'sortDefT',o:'sortDefO',g:'sortDefG'})[kind])]];
    if(kind==='q') o.push(['old',t('sortOld')],['az',t('sortAz')],['source',t('sortSource')]);
    if(kind==='c') o.push(['old',t('sortOld')],['az',t('sortAz')],['visits',t('sortVisits')],['last',t('sortLast')]);
    if(kind==='e') o.push(['new',t('sortNew')],['az',t('sortAz')]);
    if(kind==='r') o.push(['new',t('sortNew')],['old',t('sortOld')],['from',t('sortFrom')],['rating',t('sortRating')]);
    if(kind==='w') o.push(['priceHi',t('sortPriceHi')],['priceLo',t('sortPriceLo')],['new',t('sortNew')],['az',t('sortAz')]);
    if(kind==='b') o.push(['new',t('sortNew')],['old',t('sortOld')],['az',t('sortAz')],['progress',t('sortProg')]);
    if(kind==='p') o.push(['old',t('sortOld')],['az',t('sortAz')]);
    if(kind==='i') o.push(['old',t('sortOld')]);
    if(kind==='l') o.push(['old',t('sortOld')],['az',t('sortAz')]);
    if(kind==='a') o.push(['az',t('sortAz')]);
    if(kind==='t') o.push(['new',t('sortNew')],['az',t('sortAz')]);
    if(kind==='o') o.push(['new',t('sortNew')],['az',t('sortAz')]);
    if(kind==='g') o.push(['new',t('sortNew')],['az',t('sortAz')],['priceHi',t('sortPriceHi')]);
    return o;
  }
  function sortWith(kind,L,def){
    var k=sortKey(kind), cmp=def;
    if(k!=='def'){
      var byText=function(f){ return function(a,b){ return cmpText(f(a),f(b))||b.created-a.created; }; };
      var C={
        'new':function(a,b){return b.created-a.created}, old:function(a,b){return a.created-b.created},
        az:byText(function(x){return x.name||x.text}), source:byText(function(x){return x.source}), from:byText(function(x){return x.from}),
        visits:function(a,b){return (b.visits||0)-(a.visits||0)||b.created-a.created},
        last:function(a,b){return String(b.last||'').localeCompare(String(a.last||''))||b.created-a.created},
        rating:function(a,b){return (b.rating||0)-(a.rating||0)||b.created-a.created},

  function domainOf(u){ return String(u||'').replace(/^https?:\/\/(www\.)?/i,'').split(/[\/?#]/)[0]; }
  function nextOcc(x){
    if(!x.date) return null; var d=parseISO(x.date), n=new Date(); n.setHours(0,0,0,0);
    if(x.repeat==='once') return d;
    var c=new Date(n.getFullYear(),d.getMonth(),d.getDate()); if(c<n) c=new Date(n.getFullYear()+1,d.getMonth(),d.getDate()); return c;
  }
  function dateDays(x){ var o=nextOcc(x); if(!o) return null; var n=new Date(); n.setHours(0,0,0,0); return Math.round((o-n)/86400000); }
  function dateCmp(a,b){
    var da=dateDays(a), db=dateDays(b), pa=(da===null||da<0)?1:0, pb=(db===null||db<0)?1:0;
    if(pa!==pb) return pa-pb; if(pa===0) return (da-db)||(b.created-a.created); return b.created-a.created;
  }
  function tripRank(x){ return x.status==='done'?2:(x.start?0:1); }
  function tripCmp(a,b){
    var ra=tripRank(a), rb=tripRank(b); if(ra!==rb) return ra-rb;
    if(ra===0) return a.start<b.start?-1:(a.start>b.start?1:0);
    return b.created-a.created;
  }
  function oppDays(x){ return x.deadline?dayDiff(x.deadline):null; }
  function oppRank(x){ return (x.status==='want'||x.status==='prep')?0:(x.status==='applied'?1:2); }
  function oppCmp(a,b){
    var ra=oppRank(a), rb=oppRank(b); if(ra!==rb) return ra-rb;
    if(ra===0){ var da=oppDays(a), db=oppDays(b); da=(da===null)?1e9:da; db=(db===null)?1e9:db; if(da!==db) return da-db; }
    return b.created-a.created;
  }

  function mergeLink(d){

    if(!d.name.trim()){

      if(lines[0]){ d.name=lines[0].slice(0,120); got.push('name'); } else if(d.url){ d.name=domainOf(d.url); got.push('name'); }
    }
    return got;
  }
  function mergeOpp(d){

        dl.save({filename:name,data:data}).then(function(){ if(done) done(); },function(err){ if(err&&err.code==='declined') return; toast(t('exportFail')); });

      if(!armed){ armed=true; this.textContent=T('crashResetArm','Tap again to erase and reset'); return; }
      try{ var raw=localStorage.getItem(KEY); if(raw) localStorage.setItem(KEY+':crash-backup',raw); localStorage.removeItem(KEY); }catch(e){}
      location.reload();
    };

  function onErr(err){
    try{ console.error(err); }catch(x){}
    var n=Date.now(); errBurst=errBurst.filter(function(z){return n-z<8000}); errBurst.push(n);
    if(errBurst.length>=3) showCrash(err);
  }
  window.addEventListener('error',function(ev){ onErr(ev.error||ev.message); });
  window.addEventListener('unhandledrejection',function(ev){ onErr(ev.reason); });
  function startImport(raw){
    var o; try{ o=JSON.parse(raw); }catch(e){ o=null; }
    if(!o||!Array.isArray(o.quotes)||!Array.isArray(o.cafes)||!Array.isArray(o.qcats)||!Array.isArray(o.ccats)){ toast(t('impFileBad')); return; }
    openSheet({type:'import',data:o},!!sheet);
  }
  function mergeInto(o){
    o=migrate(o); var added=0;
    ['quotes','cafes','events','recs','wishes','books','places','ideas','links','dates','trips','opps','gifts'].forEach(function(k){
      var have={}; S[k].forEach(function(x){have[x.id]=1});
      o[k].forEach(function(x){ if(!have[x.id]){ S[k].push(x); added++; } });
    });
    ['qcats','ccats','ecats','rcats','wcats','bcats','pcats','icats','lcats','acats','tcats','ocats','gcats'].forEach(function(k){ o[k].forEach(function(c){ if(!S[k].some(function(x){return x.n===c.n})) S[k].push(c); }); });
    return added;
  }
  function importBody(){
    var o=sheet.data, h='<h3>'+t('impTitle')+'</h3><p class="hint" style="text-align:center;margin:0 0 10px">'+t('impFound')+'</p>';
    h+=[['q','quotes'],['c','cafes'],['e','events'],['r','recs'],['w','wishes'],['b','books'],['p','places'],['i','ideas'],['l','links'],['a','dates'],['t','trips'],['o','opps'],['g','gifts']].map(function(p){
      return '<div class="setrow"><span>'+esc(t('t'+p[0]))+'</span><span>'+((o[p[1]]||[]).length)+' <small style="color:var(--ink2)">/ '+S[p[1]].length+'</small></span></div>';
    }).join('');
    h+='<div class="btnrow"><button class="btn" data-act="impMerge">'+t('impMerge')+'</button><button class="btn ghost danger" data-act="impReplace">'+t('impReplace')+'</button><button class="btn ghost" data-act="closeSheet">'+t('cancel')+'</button></div>';
    return h;
  }

  function todayPick(list,off){
    if(!list.length) return null;
    var h=0, k=isoOf(new Date()); for(var i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0;
    return list[(h+off)%list.length];
  }
  function containerHtml(k,items){
    var cls=({q:'wall',c:'clist',e:'elist',r:'rlist',w:'wlist',b:'klist',p:'clist',i:'wall',l:'klist',a:'klist',t:'klist',o:'klist',g:'klist'})[k];
    return '<div class="'+cls+'">'+items.map(function(x){return itemHtml(k,x)}).join('')+'</div>';
  }
  function sec(title,action,inner){ return '<section class="tsec"><h3 class="tsh"><span>'+esc(title)+'</span>'+(action||'')+'</h3>'+inner+'</section>'; }
  function todayShell(){
    var dt=new Date();
    return '<div class="tdate">'+esc(t('todayLabel',dt.getMonth()+1,dt.getDate(),dt.getDay()))+'</div>'
      +'<input class="search wk" id="gq" type="search" placeholder="'+esc(t('sAll'))+'" value="'+esc(gq)+'"><div id="gres"></div>';
  }
  function globalResults(q){
    var out='';
    dataTabs().forEach(function(k){
      var L=getItems(k,{q:q,raw:true}); if(!L.length) return;
      out+=sec(t('t'+k)+' · '+L.length,L.length>4?'<button class="linkbtn" data-act="jumpQ" data-v="'+k+'">'+esc(t('seeAll',L.length))+'</button>':'',containerHtml(k,L.slice(0,4)));
    });
    return out||'<div class="empty">'+DOODLE+'<p class="wk">'+t('gNone')+'</p></div>';
  }
  function renderToday(){
    var el=$('#gres'); if(!el) return;
    var q=gq.trim(); if(q){ el.innerHTML=globalResults(q); return; }
    var on=function(k){return S.set.mods[k]!==false}, h='';
    if(on('e')){
      var up=S.events.filter(function(e){return !evState(e).past&&e.status!=='been'}).sort(evCmp);
      var wk=up.filter(function(e){return evState(e).n<=7});
      if(wk.length) h+=sec(t('secEvents'),wk.length>3?'<button class="linkbtn" data-act="goTab" data-v="e:soon">'+esc(t('seeAll',wk.length))+'</button>':'',containerHtml('e',wk.slice(0,3)));
      else if(up.length) h+=sec(t('secNext'),'',containerHtml('e',up.slice(0,1)));
    }
    if(on('w')){
      var rd=S.wishes.filter(function(w){return wishState(w).k==='ready'});
      if(rd.length) h+=sec(t('secDecide'),rd.length>2?'<button class="linkbtn" data-act="goTab" data-v="w:ready">'+esc(t('seeAll',rd.length))+'</button>':'',containerHtml('w',rd.slice(0,2)));
    }
    if(on('o')){
      var ol=S.opps.filter(function(x){var dd=oppDays(x); return (x.status==='want'||x.status==='prep')&&dd!==null&&dd>=0&&dd<=14}).sort(oppCmp);
      if(ol.length) h+=sec(t('secOpps'),ol.length>2?'<button class="linkbtn" data-act="goTab" data-v="o:urgent">'+esc(t('seeAll',ol.length))+'</button>':'',containerHtml('o',ol.slice(0,2)));
    }
    if(on('a')){
      var dl=S.dates.filter(function(x){var dd=dateDays(x); return dd!==null&&dd>=0&&dd<=14}).sort(dateCmp);
      if(dl.length) h+=sec(t('secDates'),dl.length>2?'<button class="linkbtn" data-act="goTab" data-v="a:soon">'+esc(t('seeAll',dl.length))+'</button>':'',containerHtml('a',dl.slice(0,2)));
    }
    if(on('b')){
      var reading=S.books.filter(function(x){return x.status==='reading'}).sort(function(a,b){return a.created-b.created});
      if(reading.length) h+=sec(t('secReading'), reading.length>1?'<button class="linkbtn" data-act="goTab" data-v="b:reading">'+esc(t('seeAll',reading.length))+'</button>':'', containerHtml('b',reading.slice(0,1)));
    }
    if(on('q')&&S.quotes.length){
      var qq=todayPick(S.quotes.slice().sort(function(a,b){return a.created-b.created}),todayOff.q);
      h+=sec(t('secQuote'),S.quotes.length>1?'<button class="linkbtn" data-act="tOff" data-v="q">'+t('againQ')+'</button>':'','<div class="wall solo">'+noteHtml(qq,'button')+'</div>');
    }
    if(on('c')){
      var wc=S.cafes.filter(function(c){return c.status==='want'}).sort(function(a,b){return a.created-b.created});
      if(wc.length) h+=sec(t('secCafe'),wc.length>1?'<button class="linkbtn" data-act="tOff" data-v="c">'+t('againC')+'</button>':'',containerHtml('c',[todayPick(wc,todayOff.c)]));
    }
    if(on('r')){
      var td=S.recs.filter(function(r){return r.status==='todo'}).sort(function(a,b){return a.created-b.created});
      if(td.length){ var old=td[0], days=Math.floor((Date.now()-old.created)/86400000); h+=sec(t('secRec'),days>=7?'<span class="cnt">'+esc(t('waitDays',days))+'</span>':'',containerHtml('r',[old])); }
    }
    var top=heroHtml()+digestHtml()+momHtml()+ovLinkHtml();
    var more=(top&&h)?'<details class="more"'+(moreOpen?' open':'')+'><summary>'+esc(t('tdMore'))+'</summary>'+h+'</details>':h;
    el.innerHTML=(top+more)||('<div class="empty">'+DOODLE+'<p class="wk">'+t('todayEmpty')+'</p></div>');
  }
  function renderXHint(){
    var el=$('#xhint'); if(!el) return; var q=search.trim();

    var parts=dataTabs().filter(function(k){return k!==tab}).map(function(k){return {k:k,n:getItems(k,{q:q,raw:true}).length}}).filter(function(x){return x.n>0});
    el.innerHTML=parts.length?'<span>'+esc(t('xOther'))+'</span>'+parts.map(function(x){return '<button class="tg" data-act="jump" data-v="'+x.k+'">'+esc(t('t'+x.k))+'<small>'+x.n+'</small></button>'}).join(''):'';
  }
  function jumpTab(k,q){

  /* today's picks: deadlines first, then whatever has waited longest */
  function dgKey(k,id){ return k+':'+id; }
  function dgCands(){
    var iso=isoOf(new Date()), c=[], now=Date.now();
    var add=function(k,x,sc,r){ c.push({k:k,id:x.id,s:sc+rnd(x.id,iso)*0.9,r:r}); };
    dataTabs().forEach(function(k){
      itemsOf(k).forEach(function(x){
        if(x.sample) return;
        if(k==='o'){ if(isOpen(k,x)){ var d=oppDays(x); if(d!==null&&d>=0&&d<=7){ add(k,x,100-d,'due'); return; } } }
        else if(k==='a'){ var d2=dateDays(x); if(d2!==null&&d2>=0&&d2<=3) add(k,x,95-d2,'due'); return; }
        else if(k==='e'){ if(isOpen(k,x)){ var es=evState(x); if(!es.past&&es.n<=5){ add(k,x,90-es.n,'due'); return; } } }
        else if(k==='w'){ if(wishState(x).k==='ready'){ add(k,x,80,'ready'); return; } }
        else if(k==='b'){ if(x.status==='reading'){ add(k,x,70,'read'); return; } }
        if(x.rv&&now-x.rv<7*86400000) return;
        if(k==='q'){ add(k,x,25,'pick'); return; }
        if(k==='i'){ add(k,x,22,'pick'); return; }
        if(OPENST[k]&&isOpen(k,x)){ var days=daysAgo(x.created||now); add(k,x,40+Math.min(days,60)/3,'age'); }
      });
    });
    return c;
  }
  function dgBuild(ex){
    var cs=dgCands().filter(function(c){return !ex[dgKey(c.k,c.id)]}).sort(function(a,b){return b.s-a.s}), out=[], used={};
    cs.forEach(function(c){ if(out.length<DG_N&&!used[c.k]){ used[c.k]=1; out.push(c); } });
    cs.forEach(function(c){ if(out.length<DG_N&&out.indexOf(c)<0) out.push(c); });
    return out.map(function(c){return {k:c.k,id:c.id,r:c.r}});
  }
  function dgState(){
    var iso=isoOf(new Date()), g=S.set.dg;
    if(!g||typeof g!=='object'||g.d!==iso||!Array.isArray(g.picks)) g=S.set.dg={d:iso,picks:[],done:{},skip:{}};
    if(!g.done||typeof g.done!=='object') g.done={};
    if(!g.skip||typeof g.skip!=='object') g.skip={};
    g.picks=g.picks.filter(function(p){return p&&KINDS[p.k]&&findItem(p.k,p.id)});
    var used=g.picks.length+Object.keys(g.skip).length;
    if(used<DG_N){
      var ex={}; g.picks.forEach(function(p){ex[dgKey(p.k,p.id)]=1}); Object.keys(g.skip).forEach(function(sk){ex[sk]=1});
      var add=dgBuild(ex).slice(0,DG_N-used);
      if(add.length){ g.picks=g.picks.concat(add); save(); }
    }
    return g;
  }

  function tdCommit(dir){

    if(dir==='keep'){ d.hist.push({t:'keep',k:e.k,id:e.id,prev:it.rv||0}); it.rv=Date.now(); d.keep++; actLog(1); }
    else if(dir==='del'){ var arr=itemsOf(e.k), ix=arr.indexOf(it); arr.splice(ix,1); archPut(e.k,it); d.hist.push({t:'del',k:e.k,item:it,ix:ix}); d.del++; actLog(1); }
    else { d.hist.push({t:'skip',k:e.k,id:e.id,prev:it.sk||0}); it.sk=Date.now(); d.skip++; }

    else if(hs.t==='del'){ archDrop(hs.item.id); itemsOf(hs.k).splice(Math.min(hs.ix,itemsOf(hs.k).length),0,hs.item); d.del=Math.max(0,d.del-1); actLog(-1); }

  /* ---------- one status vocabulary across tabs, and the to-do overview ---------- */
  function uStat(k,x){
    var s=x.status;
    switch(k){
      case 'c': case 'p': return s==='been'?'done':'want';
      case 'e': return s==='been'?'done':(s==='ticket'?'doing':'want');
      case 'r': return s==='done'?'done':(s==='pass'?'drop':'want');
      case 'w': return s==='bought'?'done':(s==='drop'?'drop':(s==='want'?'doing':'want'));
      case 'b': return s==='done'?'done':(s==='reading'?'doing':'want');
      case 'l': return s==='read'?'done':'want';
      case 't': return s==='done'?'done':(s==='plan'?'doing':'want');
      case 'o': return s==='closed'?'drop':(s==='applied'?'done':(s==='prep'?'doing':'want'));
      case 'g': return s==='given'?'done':(s==='bought'?'doing':'want');
    }
    return null;
  }
  function ustHtml(k,x){ var u=uStat(k,x); return u?'<span class="ustat">'+esc(t('ust'+u.charAt(0).toUpperCase()+u.slice(1)))+'</span>':''; }

    out.sort(function(a,b){ return st==='want'?((a.x.created||0)-(b.x.created||0)):((b.x.created||0)-(a.x.created||0)); });
    return out;
  }

      case 'topen': openT(v); break;
      case 'oopen': openO(v); break;
      case 'gopen': openG(v); break;
      case 'lstatus': case 'tstatus': case 'ostatus': case 'gstatus': syncDraft(); sheet.d.status=v; renderSheet(); break;
      case 'arepeat': syncDraft(); sheet.d.repeat=v; renderSheet(); break;
      case 'saveL': saveL(); break;
      case 'saveA': saveA(); break;
      case 'saveT': saveTrip(); break;
      case 'saveO': saveO(); break;
      case 'saveG': saveG(); break;
      case 'delL': delKind('l'); break;
      case 'delA': delKind('a'); break;
      case 'delT': delKind('t'); break;
      case 'delO': delKind('o'); break;
      case 'delG': delKind('g'); break;
      case 'lMark': { var lk=findItem('l',v); if(!lk) break; var pl0={status:lk.status,readDate:lk.readDate}; lk.status='read'; lk.readDate=isoOf(new Date()); save(); afterChange(); toast(t('advTo',t('lRead')),t('undo'),function(){ lk.status=pl0.status; lk.readDate=pl0.readDate; save(); afterChange(); }); break; }
      case 'oAdv': advance('o',v,['want','prep','applied'],oLabel); break;
      case 'gAdv': advance('g',v,['idea','bought','given'],gLabel); break;
      case 'popen': openP(v); break;
      case 'pstatus': syncDraft(); sheet.d.status=v; renderSheet(); break;
      case 'prate': syncDraft(); sheet.d.rating=(sheet.d.rating===+v)?0:+v; renderSheet(); break;
      case 'saveP': saveP(); break;
      case 'delP': {
        var pl=pById(sheet.id); S.places.splice(S.places.indexOf(pl),1); archPut('p',pl); save(); closeSheet(); afterChange();
        toast(t('deleted'),t('undo'),function(){ archDrop(pl.id); S.places.push(pl); save(); afterChange(); });
        break;
      }
      case 'iopen': openI(v); break;
      case 'ipin': syncDraft(); sheet.d.pin=!sheet.d.pin; renderSheet(); break;
      case 'saveI': saveI(); break;
      case 'delI': {
        var idea=iById(sheet.id); S.ideas.splice(S.ideas.indexOf(idea),1); archPut('i',idea); save(); closeSheet(); afterChange();
        toast(t('deleted'),t('undo'),function(){ archDrop(idea.id); S.ideas.push(idea); save(); afterChange(); });
        break;
      }
      case 'obReplay': { var mm=S.set.mods; openSheet({type:'onboard',sel:ONB_KINDS.reduce(function(o,k){ o[k]=(['q','c','e','r','w','b'].indexOf(k)>=0)?mm[k]!==false:!!mm[k]; return o; },{})},true); break; }
      case 'obGroup': { var gm=GROUPS[v].members, all=gm.every(function(k){return sheet.sel[k]}); gm.forEach(function(k){ sheet.sel[k]=!all; }); renderSheet(); break; }
      case 'obTog': sheet.sel[v]=!sheet.sel[v]; renderSheet(); break;
      case 'obGo': applyOnboard(sheet.sel); break;
      case 'obAll': applyOnboard(ONB_KINDS.reduce(function(o,k){o[k]=true;return o},{})); break;
      case 'a2Go': if(!a2Install()) openSheet({type:'a2hs'}); break;
      case 'a2Close': a2Dismiss(); break;
      case 'a2Install': a2Install(); break;
      case 'a2Guide': openSheet({type:'a2hs'},!!sheet); break;
      case 'a2Preview': a2Force=true; closeSheet(function(){ window.scrollTo(0,0); renderNotice(true); }); break;
      case 'a2Copy': copy(location.href.split('#')[0]); break;
      case 'togRemind': S.set.remind=!S.set.remind; save(); renderNotice(); renderSheet(); break;
      case 'setFs': S.set.fs=v; save(); applySettings(); renderSheet(); break;
      case 'snooze': S.set.snooze=Date.now()+7*86400000; save(); renderNotice(); break;
      case 'jump': jumpTab(v,search); break;
      case 'jumpQ': { var qv=gq.trim(); gq=''; jumpTab(v,qv); break; }
      case 'goTab': { var gp=v.split(':'); F[gp[0]]={s:gp[1],t:''}; jumpTab(gp[0],''); break; }
      case 'tOff': todayOff[v]=(todayOff[v]||0)+1; renderToday(); break;
      case 'clearSample': S.quotes=S.quotes.filter(function(q){return !q.sample}); S.cafes=S.cafes.filter(function(c){return !c.sample}); S.events=S.events.filter(function(e){return !e.sample}); S.recs=S.recs.filter(function(r){return !r.sample}); S.wishes=S.wishes.filter(function(w){return !w.sample}); S.books=S.books.filter(function(bk){return !bk.sample}); S.places=S.places.filter(function(pl){return !pl.sample}); S.ideas=S.ideas.filter(function(ia){return !ia.sample}); save(); renderSheet(); afterChange(); toast(t('sampleCleared')); break;
      case 'reset':
        if(!armReset){ armReset=true; renderSheet(); setTimeout(function(){ if(armReset){ armReset=false; if(sheet&&sheet.type==='set') renderSheet(); } },3500); }
        else { snapshotNow('reset'); var fresh=seed(lang), keep=S.set; keep.arch=[]; keep.dg=null; keep.act={}; S={v:8,set:keep,qcats:fresh.qcats,ccats:fresh.ccats,ecats:fresh.ecats,rcats:fresh.rcats,wcats:fresh.wcats,bcats:fresh.bcats,pcats:fresh.pcats,icats:fresh.icats,lcats:fresh.lcats,acats:fresh.acats,tcats:fresh.tcats,ocats:fresh.ocats,gcats:fresh.gcats,quotes:[],cafes:[],events:[],recs:[],wishes:[],books:[],places:[],ideas:[],links:[],dates:[],trips:[],opps:[],gifts:[]}; save(); armReset=false; sheet=null; renderSheet(); afterChange(); toast(t('wiped')); }
        break;
    }
  }
  function smartUpdateSeg(){
    var d=sheet.d;
    Array.prototype.forEach.call(document.querySelectorAll('#smartSeg button'),function(b){ b.classList.toggle('on',b.dataset.v===d.kind); });
    var h=$('#smartHint'); if(h) h.textContent=(d.text&&!d.manual)?t('smartAuto'):'';
  }
  function smartDetect(){
    syncDraft(); var d=sheet.d; if(!d.manual) d.kind=d.text.trim()?classify(d.text):(tab==='d'?dataTabs()[0]:tab);
    smartUpdateSeg();
  }

  /* ---------- events wiring ---------- */
  document.addEventListener('click',function(e){
    if(selectMode){
      var card=e.target.closest('#list [data-act$="open"]');
      if(card){ e.preventDefault(); toggleSel(card.dataset.v); return; }
    }
    if(e.target.closest('a')) return;
    var b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
    try{ act(b.dataset.act,b.dataset.v); }catch(err){ onErr(err); try{ toast(t('errToast')); }catch(x){} }
  });
  document.addEventListener('change',function(e){
    var el=e.target;
    if(el&&el.id==='s_file'){
      var f=el.files&&el.files[0]; if(!f) return;
      var rd=new FileReader(); rd.onload=function(){ startImport(String(rd.result)); }; rd.onerror=function(){ toast(t('impFileBad')); }; rd.readAsText(f); el.value=''; return;
    } if(el&&el.classList&&el.classList.contains('tname')&&sheet&&sheet.type==='tags') renameTag(sheet.kind,el.dataset.old,el.value,el);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target&&(e.target.id==='p_in')&&sheet&&sheet.d){ e.preventDefault(); pickEnter(); return; }
    if(e.key==='Enter'&&e.target&&(e.target.id==='tg_new')&&sheet&&sheet.type==='tags'){ e.preventDefault(); act('tgAdd'); return; }
    if(sheet&&sheet.type==='triage'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!(e.target&&e.target.matches&&e.target.matches('input,textarea'))){ e.preventDefault(); tdFly(e.key==='ArrowLeft'?'del':'keep'); return; }
    if(e.key==='Tab'&&sheet){ trapTab(e); return; }
    if(e.key==='Escape'&&sheet){ if(sheet.type==='onboard') return; closeSheet(); return; }
    if(e.key==='Escape'&&selectMode){ exitSelect(); return; }
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.ccard[data-act],.ecard[data-act],.rcard[data-act],.wcard[data-act]')){ e.preventDefault(); if(selectMode) toggleSel(e.target.dataset.v); else act(e.target.dataset.act,e.target.dataset.v); }
  });
  var searchT=null;
  document.addEventListener('input',function(e){
    var id=e.target.id;
    if(id==='q'){ clearTimeout(searchT); var val=e.target.value; searchT=setTimeout(function(){ search=val; refreshList(); },90); }
    else if(id==='f_info'&&sheet&&(sheet.type==='c'||sheet.type==='e'||sheet.type==='w'||sheet.type==='b'||sheet.type==='p'||sheet.type==='l'||sheet.type==='o'||sheet.type==='g')) liveParse(sheet.type);
    else if(id==='f_why'&&sheet&&sheet.type==='r') liveParse('r');
    else if(id==='p_in'&&sheet&&sheet.d) refreshPicker();
    else if(id==='gq'){ clearTimeout(searchT); var gv=e.target.value; searchT=setTimeout(function(){ gq=gv; renderToday(); },90); }
    else if(id==='s_cur'){ S.set.cur=e.target.value.trim()||'NT$'; save(); if(tab==='w'){ renderWStats(); refreshList(); } }
    else if(id==='f_smart'&&sheet&&sheet.type==='smart') smartDetect();
    else if(id==='s_dnt'){ var tv=e.target.value, dc=dnCfg(); if(/^([01]\d|2[0-3]):[0-5]\d$/.test(tv)){ var nw=new Date(); if(tv>pad2(nw.getHours())+':'+pad2(nw.getMinutes())) dc.last=''; dc.time=tv; save(); } }
  });
  document.addEventListener('toggle',function(e){
    var el=e.target; if(el&&el.classList&&el.classList.contains('acc')&&sheet&&sheet.open) sheet.open[el.dataset.k]=el.open;
    if(el&&el.classList&&el.classList.contains('more')) moreOpen=el.open;
  },true);
  if(window.matchMedia){ try{ window.matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',applySettings); }catch(e){} }

  /* ---------- boot ---------- */
  try{
    try{ localStorage.setItem('shiguang:probe','1'); localStorage.removeItem('shiguang:probe'); }catch(e){ storeFail=true; }
    tab=activeTabs()[0];
    applySettings(); renderShell(); renderContent(0);
    if(lastFixes>0){ save(); setTimeout(function(){ try{ toast(t('sanFixed',lastFixes)); }catch(e){} },900); }
    readShare();
    if(S.set.intro&&!pendingShare) showIntro(); else { appEnter(); afterIntro(); }
    setInterval(function(){ try{ dnCheck(); }catch(e){} },60000);
    document.addEventListener('visibilitychange',function(){ if(!document.hidden){ try{ dnCheck(); if(tab==='d'&&!sheet) renderToday(); }catch(e){} } });
    setTimeout(function(){ try{ dnCheck(); }catch(e){} },2500);
    try{ if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!a2Env().framed) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  }catch(err){ showCrash(err); }
})();
</script>
