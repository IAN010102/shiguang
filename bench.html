<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>拾光小本 測試頁</title>
<style>
body{font:16px/1.6 system-ui,"Noto Sans TC",sans-serif;max-width:720px;margin:0 auto;padding:16px;color:#1a1a1a}
h1{font-size:1.25rem;margin:.2em 0}
textarea{width:100%;min-height:260px;box-sizing:border-box;font:inherit;padding:10px;border:2px solid #003366;border-radius:12px}
button{font:inherit;padding:10px 22px;border-radius:999px;border:0;background:#003366;color:#fff;margin:10px 8px 0 0}
button:disabled{opacity:.4}
small,.hint{color:#5e6b7a}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:.9rem}
td,th{border-bottom:1px solid #dde;padding:6px 4px;text-align:left;vertical-align:top}
.bad{color:#b44b33}
</style></head><body>
<h1>拾光小本 · 準確率測試頁</h1>
<p class="hint">把你真的存過的內容貼進來。每一則之間,單獨一行打 <b>====</b> 分開。最多 30 則。按「開始」會逐則送去真正的 AI,大約 1 分鐘。測完按「複製結果」,貼回給 Claude。</p>
<textarea id="t" placeholder="第一則內容&#10;====&#10;第二則內容&#10;====&#10;..."></textarea>
<div><button id="go">開始</button><button id="cp" disabled>複製結果</button> <small id="st"></small></div>
<table id="tb"></table>
<script>
var KINDS=['q','c','e','r','w','b','p','i','l','a','t','o','g'], out=[];
var NAME={q:'句子',c:'咖啡廳',e:'活動',r:'被推薦',w:'想買',b:'書',p:'地點',i:'靈感筆記',l:'稍後閱讀',a:'日子',t:'旅行',o:'機會',g:'送禮'};
function iso(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
document.getElementById('go').onclick=async function(){
  var items=document.getElementById('t').value.split(/^\s*={3,}\s*$/m).map(function(x){return x.trim()}).filter(Boolean).slice(0,30);
  var st=document.getElementById('st'), tb=document.getElementById('tb'); out=[];
  if(!items.length){st.textContent='先貼內容';return}
  this.disabled=true; document.getElementById('cp').disabled=true;
  tb.innerHTML='<tr><th>#</th><th>內容開頭</th><th>AI 判斷</th><th>名稱</th></tr>';
  for(var i=0;i<items.length;i++){
    st.textContent='進行中 '+(i+1)+' / '+items.length;
    var rec={n:i+1,text:items[i],kind:null,name:null,confidence:null,error:null};
    try{
      var r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:items[i],kinds:KINDS,lang:'zh',today:iso(),verify:false})});
      if(r.status===429){rec.error='rate_limited'}
      else if(!r.ok){rec.error='http '+r.status}
      else{var j=await r.json(); rec.kind=j.kind; rec.name=j.name; rec.confidence=j.confidence; rec.count=(j.items&&j.items.length)||1;}
    }catch(e){rec.error=String(e&&e.message||e)}
    out.push(rec);
    tb.insertAdjacentHTML('beforeend','<tr><td>'+rec.n+'</td><td>'+esc(rec.text.slice(0,26).replace(/\s+/g,' '))+'</td><td'+(rec.error?' class="bad"':'')+'>'+esc(rec.error||NAME[rec.kind]||rec.kind)+'</td><td>'+esc(rec.name||'')+'</td></tr>');
    if(rec.error==='rate_limited'){st.textContent='太快被限流了,等 10 分鐘後再按開始(只貼剩下的)';break}
    await wait(1500);
  }
  if(st.textContent.indexOf('進行中')===0) st.textContent='完成,共 '+out.length+' 則';
  this.disabled=false; document.getElementById('cp').disabled=!out.length;
};
document.getElementById('cp').onclick=function(){
  var s=JSON.stringify(out,null,1), b=this;
  (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){b.textContent='已複製'},function(){var ta=document.getElementById('t');ta.value=s;ta.select();b.textContent='請手動複製上方文字'});
};
</script></body></html>
